<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 50" width="340" height="50">
  <!-- LTS Monogram Icon -->
  <g transform="translate(0, 2)">
    <!-- Handles -->
    <path d="M 10 10 C 10 4 16 4 16 10" stroke="#ff5500" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="2" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="38" fill="#ff5500">L</text>

    <text x="26" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="38" fill="#111111">T</text>

    <path d="M 54 10 C 54 4 60 4 60 10" stroke="#ff5500" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="48" y="42" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="38" fill="#ff5500">S</text>
  </g>

  <!-- Divider Line -->
  <line x1="82" y1="10" x2="82" y2="40" stroke="#ff5500" stroke-width="2" stroke-linecap="round" />

  <!-- Full Brand Text: Local Trade Street -->
  <text x="94" y="35" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="24">
    <tspan fill="#ff5500">Local</tspan>
    <tspan fill="#111111"> Trade </tspan>
    <tspan fill="#ff5500">Street</tspan>
  </text>
</svg>
