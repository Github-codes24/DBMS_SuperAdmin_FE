<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- LTS Monogram Logo -->
  <g transform="translate(5, 5)">
    <!-- L (Orange with handle loop) -->
    <path d="M 6 12 C 6 9 10 9 10 12 L 10 16 L 16 16 C 18 16 18 20 16 20 L 6 20 Z" fill="#ff5500" />
    <text x="5" y="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#ff5500">L</text>
    <!-- Handle on L -->
    <path d="M 12 8 Q 16 2 20 8" stroke="#ff5500" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- T (Black) -->
    <text x="35" y="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#111111">T</text>

    <!-- S (Orange with handle loop) -->
    <text x="62" y="44" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#ff5500">S</text>
    <!-- Handle on S -->
    <path d="M 72 8 Q 76 2 80 8" stroke="#ff5500" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>